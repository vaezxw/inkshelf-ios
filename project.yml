name: InkShelf
options:
  bundleIdPrefix: com.inkshelf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"
targets:
  InkShelf:
    type: application
    platform: iOS
    sources:
      - path: InkShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkshelf.app
        PRODUCT_NAME: InkShelf
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        INFOPLIST_KEY_CFBundleDisplayName: 墨架
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SwiftSoup
    info:
      path: InkShelf/Resources/Info.plist
      properties:
        UIBackgroundModes: []
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  InkShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InkShelfTests
    dependencies:
      - target: InkShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkshelf.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  InkShelf:
    build:
      targets:
        InkShelf: all
        InkShelfTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InkShelfTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
